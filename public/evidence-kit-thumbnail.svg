<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">TwelveCheck Evidence Kit thumbnail</title>
  <desc id="desc">Square orange, black, and white cover for the TwelveCheck offline evidence workbook.</desc>
  <rect width="1254" height="1254" fill="#111111"/>
  <style>
    .display { font-family: Arial Narrow, Arial, sans-serif; font-weight: 900; }
    .mono { font-family: Courier New, monospace; }
  </style>
  <rect x="42" y="42" width="1170" height="1170" fill="#ffffff"/>
  <text x="88" y="127" class="display" fill="#111111" font-size="58">TWELVE<tspan fill="#ff3d0a">CHECK</tspan></text>
  <text x="1164" y="122" class="mono" fill="#111111" font-size="25" font-weight="700" text-anchor="end">OFFLINE V1.0</text>
  <rect x="88" y="164" width="1076" height="5" fill="#111111"/>
  <text x="82" y="330" class="display" fill="#111111" font-size="152" letter-spacing="-7">EVIDENCE</text>
  <text x="82" y="472" class="display" fill="#ff3d0a" font-size="152" letter-spacing="-7">KIT</text>
  <text x="90" y="542" class="mono" fill="#111111" font-size="27" font-weight="700">RUN THE CHECKS. KEEP THE PROOF.</text>
  <g transform="translate(88 598)">
    <rect width="1076" height="94" fill="#ffe6e3" stroke="#111111" stroke-width="4"/>
    <rect width="18" height="94" fill="#b3261e"/>
    <text x="43" y="38" class="mono" fill="#111111" font-size="24" font-weight="700">P0 / CHECK 05</text>
    <text x="43" y="73" class="display" fill="#111111" font-size="34">SIGNUP JOURNEY BLOCKED</text>
  </g>
  <g transform="translate(88 713)">
    <rect width="1076" height="94" fill="#fff0e8" stroke="#111111" stroke-width="4"/>
    <rect width="18" height="94" fill="#ff3d0a"/>
    <text x="43" y="38" class="mono" fill="#111111" font-size="24" font-weight="700">P1 / CHECK 09</text>
    <text x="43" y="73" class="display" fill="#111111" font-size="34">PRICING DRIFTS AT CHECKOUT</text>
  </g>
  <g transform="translate(88 828)">
    <rect width="1076" height="94" fill="#fff8dd" stroke="#111111" stroke-width="4"/>
    <rect width="18" height="94" fill="#d18b00"/>
    <text x="43" y="38" class="mono" fill="#111111" font-size="24" font-weight="700">P2 / CHECK 03</text>
    <text x="43" y="73" class="display" fill="#111111" font-size="34">CTA LABEL HIDES NEXT STEP</text>
  </g>
  <rect x="88" y="980" width="310" height="146" fill="#ff3d0a"/>
  <text x="116" y="1077" class="display" fill="#ffffff" font-size="96">$9</text>
  <text x="447" y="1025" class="mono" fill="#111111" font-size="24" font-weight="700">12 PRELOADED CHECKS</text>
  <text x="447" y="1066" class="mono" fill="#111111" font-size="24" font-weight="700">CSV • JSON • MARKDOWN • PRINT</text>
  <text x="447" y="1107" class="mono" fill="#111111" font-size="24" font-weight="700">NO ACCOUNT • NO UPLOAD</text>
</svg>
