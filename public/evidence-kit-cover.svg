<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TwelveCheck Evidence Kit</title>
  <desc id="desc">A branded cover for an offline SaaS launch evidence workbook with twelve checks and report exports.</desc>
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect x="0" y="0" width="1600" height="22" fill="#111111"/>
  <rect x="0" y="878" width="1600" height="22" fill="#111111"/>
  <style>
    .display { font-family: Arial Narrow, Arial, sans-serif; font-weight: 900; }
    .mono { font-family: Courier New, monospace; }
    .ink { fill: #111111; }
    .orange { fill: #ff3d0a; }
    .white { fill: #ffffff; }
  </style>
  <text x="78" y="86" class="display ink" font-size="42">TWELVE<tspan class="orange">CHECK</tspan> / EVIDENCE KIT</text>
  <rect x="78" y="118" width="570" height="4" fill="#111111"/>
  <text x="78" y="188" class="mono orange" font-size="22" font-weight="700">RUN THE CHECKS. KEEP THE PROOF.</text>
  <text x="72" y="320" class="display ink" font-size="116" letter-spacing="-5">LAUNCH</text>
  <text x="72" y="430" class="display orange" font-size="116" letter-spacing="-5">EVIDENCE,</text>
  <text x="72" y="520" class="display ink" font-size="88" letter-spacing="-3">NOT OPINIONS.</text>
  <text x="80" y="644" class="mono ink" font-size="22">OFFLINE WORKBOOK • 12 PRELOADED CHECKS</text>
  <text x="80" y="680" class="mono ink" font-size="22">JSON • CSV • MARKDOWN • PRINT EXPORTS</text>
  <rect x="78" y="735" width="340" height="82" fill="#ff3d0a"/>
  <text x="103" y="792" class="display white" font-size="54">$9</text>
  <text x="208" y="775" class="mono white" font-size="17" font-weight="700">ONE-TIME</text>
  <text x="208" y="799" class="mono white" font-size="17" font-weight="700">INSTANT DOWNLOAD</text>
  <g transform="translate(820 112)">
    <rect x="18" y="18" width="754" height="676" fill="#111111"/>
    <rect x="0" y="0" width="754" height="676" fill="#ffffff" stroke="#111111" stroke-width="5"/>
    <rect x="0" y="0" width="754" height="76" fill="#111111"/>
    <text x="30" y="48" class="display white" font-size="30">PROJECT / LAUNCH READINESS</text>
    <rect x="590" y="19" width="132" height="38" fill="#ff3d0a"/>
    <text x="656" y="45" class="mono white" font-size="16" font-weight="700" text-anchor="middle">OFFLINE</text>
    <text x="30" y="126" class="mono orange" font-size="17" font-weight="700">AUTOMATIC SUMMARY</text>
    <g transform="translate(30 147)">
      <g><rect width="128" height="88" fill="#f4f4f1" stroke="#111111" stroke-width="2"/><text x="18" y="50" class="display ink" font-size="38">12</text><text x="18" y="72" class="mono ink" font-size="11">CHECKS</text></g>
      <g transform="translate(142 0)"><rect width="128" height="88" fill="#fff0e8" stroke="#111111" stroke-width="2"/><text x="18" y="50" class="display orange" font-size="38">03</text><text x="18" y="72" class="mono ink" font-size="11">FINDINGS</text></g>
      <g transform="translate(284 0)"><rect width="128" height="88" fill="#f4f4f1" stroke="#111111" stroke-width="2"/><text x="18" y="50" class="display ink" font-size="38">01</text><text x="18" y="72" class="mono ink" font-size="11">P0</text></g>
      <g transform="translate(426 0)"><rect width="128" height="88" fill="#f4f4f1" stroke="#111111" stroke-width="2"/><text x="18" y="50" class="display ink" font-size="38">02</text><text x="18" y="72" class="mono ink" font-size="11">P1</text></g>
      <g transform="translate(568 0)"><rect width="126" height="88" fill="#f4f4f1" stroke="#111111" stroke-width="2"/><text x="18" y="50" class="display ink" font-size="38">08</text><text x="18" y="72" class="mono ink" font-size="11">PASS</text></g>
    </g>
    <text x="30" y="282" class="mono orange" font-size="17" font-weight="700">FINDINGS / EVIDENCE LOG</text>
    <g transform="translate(30 303)">
      <rect width="694" height="94" fill="#ffe6e3" stroke="#111111" stroke-width="2"/>
      <rect width="10" height="94" fill="#b3261e"/>
      <text x="28" y="31" class="mono ink" font-size="14" font-weight="700">P0 / CHECK 05</text>
      <text x="28" y="61" class="display ink" font-size="24">SIGNUP JOURNEY BLOCKED</text>
      <text x="575" y="57" class="mono ink" font-size="13">TC-05.png</text>
    </g>
    <g transform="translate(30 411)">
      <rect width="694" height="94" fill="#fff0e8" stroke="#111111" stroke-width="2"/>
      <rect width="10" height="94" fill="#ff3d0a"/>
      <text x="28" y="31" class="mono ink" font-size="14" font-weight="700">P1 / CHECK 09</text>
      <text x="28" y="61" class="display ink" font-size="24">PRICING DRIFTS AT CHECKOUT</text>
      <text x="575" y="57" class="mono ink" font-size="13">TC-09.png</text>
    </g>
    <g transform="translate(30 519)">
      <rect width="694" height="94" fill="#fff8dd" stroke="#111111" stroke-width="2"/>
      <rect width="10" height="94" fill="#d18b00"/>
      <text x="28" y="31" class="mono ink" font-size="14" font-weight="700">P2 / CHECK 03</text>
      <text x="28" y="61" class="display ink" font-size="24">CTA LABEL HIDES NEXT STEP</text>
      <text x="575" y="57" class="mono ink" font-size="13">TC-03.png</text>
    </g>
    <text x="30" y="647" class="mono ink" font-size="14">NO ACCOUNT • NO UPLOAD • DATA STAYS LOCAL</text>
  </g>
</svg>
